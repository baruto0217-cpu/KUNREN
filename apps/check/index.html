<!DOCTYPE html>
<html lang="ja">
<head>
<script>/* まとめアプリ内：オフライン保存はまとめアプリ側で行う */if('serviceWorker' in navigator){try{Object.defineProperty(navigator.serviceWorker,'register',{value:function(){return Promise.reject(new Error('suite'))}})}catch(e){}}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動記録票チェックリスト</title>
<style>
:root {
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;
  --text:#e6edf3;--text2:#9da7b3;--text3:#6e7681;
  --ok:#3fb950;--ng:#ff4d6a;--na:#5a6a8a;--warn:#d29922;
  --accent:#58a6ff;--r:8px;--r-lg:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;font-size:16px;line-height:1.6;min-height:100vh;}
button,textarea{font-family:inherit;}

header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100;}
.hd-main{font-size:17px;font-weight:700;}
.hd-badge{margin-left:auto;font-size:13px;background:var(--bg3);border:1px solid var(--border);border-radius:99px;padding:4px 12px;color:var(--text2);white-space:nowrap;}
.hd-badge b{color:var(--ok);}

.tab-bar{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;padding:0 12px;position:sticky;top:56px;z-index:99;overflow-x:auto;}
.tab-btn{padding:12px 16px;font-size:15px;font-weight:700;color:var(--text2);background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

.app{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 106px);}
aside{background:var(--bg2);border-right:1px solid var(--border);padding:14px 0;position:sticky;top:106px;height:calc(100vh - 106px);overflow-y:auto;}
.side-items{display:flex;flex-direction:column;}
.side-item{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:14px;color:var(--text2);cursor:pointer;border-left:3px solid transparent;line-height:1.4;background:none;border-top:none;border-right:none;border-bottom:none;text-align:left;}
.side-item:hover{background:var(--bg3);color:var(--text);}
.side-item.active{color:var(--text);background:rgba(88,166,255,0.08);border-left-color:var(--accent);}
.side-pct{margin-left:auto;font-size:12px;color:var(--text3);flex-shrink:0;}
.side-pct.done{color:var(--ok);}
.side-divider{border:none;border-top:1px solid var(--border);margin:12px 0;}
.reset-btn{margin:4px 14px 0;width:calc(100% - 28px);padding:10px;background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:var(--r);font-size:14px;cursor:pointer;}
.reset-btn:hover{border-color:var(--text2);color:var(--text);}

.sum{margin:0 14px 10px;border-radius:var(--r);overflow:hidden;border:1px solid var(--bdc);}
.sum.ng{--c:var(--ng);--bdc:rgba(255,77,106,0.35);--hb:rgba(255,77,106,0.12);}
.sum.pb{--c:var(--warn);--bdc:rgba(210,153,34,0.4);--hb:rgba(210,153,34,0.12);}
.sum-head{background:var(--hb);padding:9px 12px;font-size:14px;font-weight:700;color:var(--c);cursor:pointer;user-select:none;width:100%;border:none;text-align:left;}
.sum-body{background:var(--bg);max-height:320px;overflow-y:auto;}
.sum-item{padding:8px 12px;font-size:13px;color:var(--text2);border-bottom:1px solid var(--border);line-height:1.5;cursor:pointer;}
.sum-item:last-child{border-bottom:none;}
.sum-item:hover{background:var(--bg3);color:var(--text);}
.sum-item .memo{display:block;color:var(--text);margin-top:2px;}
.sum-empty{padding:10px 12px;font-size:13px;color:var(--text3);text-align:center;}

main{padding:20px;max-width:900px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.section-block{margin-bottom:24px;scroll-margin-top:116px;}
.sec-title{font-size:16px;font-weight:700;color:var(--text2);padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:12px;}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden;}
.card.all-done{border-color:rgba(63,185,80,0.4);}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;width:100%;background:none;border:none;color:var(--text);text-align:left;}
.card-head:hover{background:var(--bg3);}
.card-name{font-size:15px;font-weight:700;flex:1;}
.card-kind{font-size:12px;color:var(--text3);font-weight:400;margin-left:6px;}
.card-badge{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
.card-badge.done{color:var(--ok);border-color:rgba(63,185,80,0.4);}
.chev{color:var(--text3);font-size:12px;transition:transform .2s;}
.card.collapsed .chev{transform:rotate(-90deg);}
.card.collapsed .card-body{display:none;}
.card-body{border-top:1px solid var(--border);}

.item{padding:12px 14px;border-bottom:1px solid var(--border);scroll-margin-top:116px;}
.item:last-child{border-bottom:none;}
.item.st-ok{background:rgba(63,185,80,0.06);}
.item.st-ng{background:rgba(255,77,106,0.07);}
.item.st-pb{background:rgba(210,153,34,0.08);}
.item.st-na{background:rgba(90,106,138,0.07);}
.item.flash{outline:2px solid var(--accent);outline-offset:-2px;}
.label{font-size:16px;line-height:1.65;}
.item.st-ok .label,.item.st-na .label{color:var(--text2);}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px;white-space:nowrap;}
.tag.add{background:rgba(88,166,255,0.15);color:var(--accent);}
.tag.local{background:rgba(210,153,34,0.15);color:var(--warn);}
.tag.q{background:rgba(110,118,129,0.25);color:var(--text2);}
.btns{display:flex;gap:8px;margin-top:10px;}
.sbtn{flex:1;min-height:44px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg3);color:var(--text2);font-size:14px;font-weight:700;cursor:pointer;}
.sbtn.on-ok{background:var(--ok);border-color:var(--ok);color:#fff;}
.sbtn.on-ng{background:var(--ng);border-color:var(--ng);color:#fff;}
.sbtn.on-pb{background:var(--warn);border-color:var(--warn);color:#111;}
.sbtn.on-na{background:var(--na);border-color:var(--na);color:#fff;}
.memo-in{display:block;width:100%;margin-top:10px;min-height:44px;padding:8px 10px;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:var(--r);resize:vertical;}
.memo-in:focus{outline:none;border-color:var(--accent);}
.note{font-size:13px;color:var(--text3);margin:0 0 16px;line-height:1.6;}

@media(max-width:760px){
  header{padding:0 14px;}
  .hd-main{font-size:15px;}
  .tab-btn{padding:11px 12px;font-size:14px;}
  .app{grid-template-columns:1fr;}
  aside{position:sticky;top:104px;height:auto;z-index:50;border-right:none;border-bottom:1px solid var(--border);padding:8px 0;}
  .side-items{flex-direction:row;overflow-x:auto;gap:6px;padding:0 12px;}
  .side-item{flex-shrink:0;border:1px solid var(--border);border-radius:99px;padding:6px 12px;font-size:13px;}
  .side-item.active{border-color:var(--accent);}
  .side-label,.side-divider,.side-extra{display:none;}
  .mobile-extra{display:block;}
  main{padding:14px;}
  .section-block,.item{scroll-margin-top:160px;}
}
@media(min-width:761px){.mobile-extra{display:none;}}
</style>
</head>
<body>

<header>
  <div class="hd-main">🚑 活動記録票チェックリスト</div>
  <div class="hd-badge">確認済み <b id="g-done">0</b> / <span id="g-total">0</span></div>
</header>

<div class="tab-bar" id="tab-bar"></div>
<div class="app">
  <aside id="aside"></aside>
  <main id="main"></main>
</div>

<script>
// 項目の書き方：文字列、または { t:文, add:追加した項目, local:地域MCの決まりで要確認, q:言葉の意味が要確認 }
// 群の kind：'rec'＝記載の確認（記載あり／記載なし／該当なし）、'act'＝活動の評価（問題なし／問題あり／該当なし）
const TABS = [
  { id:'cpa', name:'🫀 心肺停止（CPA）' },
  { id:'liq', name:'💉 心肺停止前（ショック）' },
  { id:'glu', name:'🍬 ブドウ糖溶液投与' },
  { id:'dnar', name:'📋 DNAR' },
];
const KIND = {
  rec: { name:'記載の確認', btn:[['ok','記載あり'],['ng','記載なし'],['na','該当なし']] },
  act: { name:'活動の評価', btn:[['ok','問題なし'],['pb','問題あり'],['na','該当なし']] },
};

// ── 共通の項目 ──
const BASIC_COMMON = ['救急隊名','記載者名','指令日時を始めとした各時刻','傷病者情報','発生場所','事故原因','主訴'];
const REC_HEAD = [
  '現着時刻など各時刻が正確であるか。',
  '出場場所までの距離などから誤った記載と思われる箇所はないか。',
  '活動中に聴取した情報が発生場所・事故原因・発生形態・主訴欄または備考欄に十分記載されているか。',
];
const REC_SHOCK_OBS = [
  '意識の状態が分かる記載となっているか。',
  '呼吸の状態が分かる記載となっているか。',
  '脈拍の状態が分かる記載となっているか。',
  '顔色・皮膚の状態（色調・冷感・湿潤）が分かる記載となっているか。',
];
const REC_CPA_PROC = [
  '口頭指導が実施されなかった場合、その理由が記載されているか。',
  '接触時CPAの場合、呼吸の状態が分かる記載となっているか。',
  '接触時CPAの場合、脈の状態が分かる記載となっているか。',
  'ピリオド毎の活動が分かる記載となっているか。',
  { t:'調整確認時の観察結果が記載されているか。', q:true },
  '特定行為（器具による気道確保・静脈路確保・薬剤投与）について、医師の具体的指示があるか。',
  '指示した医師・指示の内容・指示を受けた時刻が分かる記載となっているか。',
  '処置を行った救急救命士が分かる記載となっているか。',
  '行った処置（除細動）が記載されているか。',
  '行った処置（気道確保）が記載されているか。',
  '行った処置（静脈路確保）が記載されているか。',
  '行った処置（薬剤投与）が記載されているか。',
  { t:'薬剤を投与した場合、投与時刻・投与量・投与間隔が記載されているか。', add:true },
  '吸引を行った場合、吸引物の性状・量が記載されているか。',
  '処置の結果・効果が記載されているか。',
  '処置が不良の場合の対処は記載されているか。',
  'BVM等での換気状況は記載されているか。',
  'チューブサイズの記載がされているか。',
  { t:'気道確保器具を使った場合、位置確認の方法（ETCO₂波形など）と、移動後の再確認が記載されているか。', add:true },
  '除細動のエネルギー量の記載がされているか。',
  '胸骨圧迫と人工呼吸の同期・非同期の別が記載されているか。',
  '心拍が再開した場合、それが分かる記載となっているか。',
];
const REC_TEAM = [
  '消防隊など先着隊から引き継いだ場合、先着隊の活動が記載されているか。',
  '支援隊の活動が記載されているか。',
];
const SUPPORT = { title:'🚒 消防支援隊', groups:[
  { name:'支援隊の活動', kind:'act', items:[
    '消防隊など先着隊の活動は適切であったか。',
    '先着隊からの引き継ぎにおいて、必要な情報伝達がされていたか。',
  ]},
]};
const WITNESSED = [
  '心停止前にショックの状態ではなかったか。',
  '心停止前の時点で、心肺停止前の静脈路確保・輸液の対象かを評価し、所見を医師に報告して具体的指示を受けたか。',
];
const LINK = [
  '救急隊による事前管制は迅速に行われたか。',
  '救急隊による消防隊の応援・増隊の時期は適切であったか。',
  '救急隊による救助隊等の応援・増隊の時期は適切であったか。',
];
const PUNCTURE = { t:'静脈路確保にいたずらに時間を費やしておらず、穿刺回数は原則２回までとしているか。', local:true };
const PROC_COMMON = [
  '医師からの指示を受けてから、処置を実施するまでに時間がかかりすぎていないか。',
  '医療機関との電話連絡で不都合は無かったか。',
];
const RESULT = [
  '実施した処置に対する結果・効果が正しく把握されていたか。',
  '処置の結果が不良の場合の対応は適切であったか。',
];
const NO_GEAR = '必要な資機材を現場に携行しなかったことにより、時間が延長したり処置が実施されなかった活動でないか。';
const TO_DEPART = '傷病者接触から現場出発（現場処置終了後〜救急車内収容〜現場出発）まで時間がかかりすぎていないか。';

const DATA = {
  cpa: {
    s1: { title:'📋 記載状況・記載内容', groups:[
      { name:'基本記載項目', kind:'rec', items:[
        ...BASIC_COMMON,'心停止目撃の有無','目撃者','心停止の推定原因','初期ECG','口頭指導の実施状況',
        'バイスタンダーCPRの実施状況','活動方針','PADについて','処置経過','備考欄','収容医療機関情報等',
      ]},
      { name:'記載内容', kind:'rec', items:[ ...REC_HEAD, '活動隊の聴取事項として十分なものであるか。', ...REC_CPA_PROC, ...REC_TEAM ]},
    ]},
    s2: { title:'🚑 活動内容【救急隊】', groups:[
      { name:'時間・プロトコール', kind:'act', items:[
        'プロトコールに沿った活動となっているか。',
        { t:'現場活動時間が、薬剤投与実施症例で５ピリオド（10分）、その他の活動で３ピリオド（6分）を目途に、これより大幅に延長していないか。延長した場合、その理由（救出困難・安全確保など）が妥当か。', local:true },
        '傷病者接触から現場出発までの時間がかかりすぎていないか。',
        '２分のピリオドが守られているか。',
        'ＣＰＲが10秒以上中断されていないか。',
      ]},
      { name:'処置・資機材', kind:'act', items:[
        '実施した処置は適切であったか。',
        NO_GEAR,
        'アドレナリンの投与は、適応に合致しているか。',
        '気管挿管は、適応に合致しているか。',
        ...PROC_COMMON,
        { t:'静脈路の確保は、１ピリオド内で完了しているか。', local:true },
        { t:'気道確保手技は、１ピリオド内で完了しているか。', local:true },
        '気道確保と薬剤投与の優先順位の判断は適切であったか。',
        '気道確保器具による気道確保を実施後、直ちにETCO₂モニターを装着し、波形で位置を確認したか。',
        'ETCO₂モニターで継続的に評価し、移動の後にもチューブの位置を確かめたか。',
        ...RESULT,
      ]},
      { name:'AED・DC・CPR', kind:'act', items:[
        'AED・除細動器の手順に従って速やかに解析・除細動し、胸骨圧迫の中断を最小限にしたか。',
        'ＤＣが必要な状態に対してＤＣが適切に実施されているか。',
        { t:'ショックの前後で胸骨圧迫の中断が短く、ショック後すぐに圧迫を再開したか。', add:true },
        { t:'胸骨圧迫の質（速さ・深さ・圧迫の解除）は保たれていたか。', add:true },
        { t:'過換気になっていなかったか。', add:true },
        '現場活動ピリオド終了から救急車内までの間、有効なＣＰＲが実施されているか。',
        { t:'心拍再開後の呼吸・循環の管理（換気・酸素化・血圧の観察）は適切だったか。', add:true },
      ]},
      { name:'連携・指令', kind:'act', items:[
        '救急隊によるトリアージプロトコールは適切であったか。',
        '救急隊による口頭指導は適切であったか。',
        ...LINK,
        '救急隊による医師要請の時期は適切であったか。',
      ]},
    ]},
    s3: { title:'👁 救急隊目撃の心停止（追加の確認）', groups:[
      { name:'救急隊目撃の心停止（心停止前に観察・介入できた場合のみ）', kind:'act', items: WITNESSED },
    ]},
    s4: SUPPORT,
  },

  liq: {
    s1: { title:'📋 記載状況・記載内容', groups:[
      { name:'基本記載項目', kind:'rec', items:[ ...BASIC_COMMON,'活動方針','処置経過','備考欄','収容医療機関情報等' ]},
      { name:'記載内容', kind:'rec', items:[
        ...REC_HEAD,
        '活動隊の聴取事項として十分なものであるか。',
        '現場の状況・観察項目・傷病者の評価が記載されているか。',
        ...REC_SHOCK_OBS,
        { t:'血圧の実測値と、その推移が記載されているか。', add:true },
        { t:'年齢（15歳以上・推定を含む）が分かる記載があるか。', add:true },
        '可能性の高いショックの病態について記載があるか。',
        'クラッシュ症候群（それに至る可能性を含む）の判断が記載されているか。',
        '現場で処置を実施した場合、その理由が記載されているか。',
        '処置を実施しなかった理由の記載があるか。',
        '説示についての記載があるか。',
        '了解が得られなかった場合、その理由の記載があるか。',
        '静脈路確保・輸液について、医師の具体的指示があるか。',
        '指示した医師・指示の内容・指示を受けた時刻が分かる記載となっているか。',
        '処置を行った救急救命士が分かる記載となっているか。',
        '留置針のゲージサイズの記載がされているか。',
        { t:'輸液の種類（製剤名）が記載されているか。', add:true },
        '滴下速度の記載がされているか。',
        '医師の指示量と、実際の輸液量が記載されているか。',
        { t:'穿刺部の腫れ・痛み・漏れの有無と、その対応が記載されているか。', add:true },
        { t:'輸液後の血圧・呼吸・循環・意識の変化が、時刻とともに記載されているか。', add:true },
        '処置が不良の場合の対処は記載されているか。',
        ...REC_TEAM,
      ]},
    ]},
    s2: { title:'🚑 活動内容【救急隊】', groups:[
      { name:'時間・活動方針', kind:'act', items:[
        '処置の時間と医療機関までの時間を考慮した活動となっているか。',
        '現場にて処置を実施した場合、その判断は適切か。',
        { t:'現場にて処置を実施した場合、現場活動時間が10分を目途として大幅に延長していないか。', local:true },
        TO_DEPART,
        NO_GEAR,
      ]},
      { name:'処置・対応', kind:'act', items:[
        { t:'処置の対象（15歳以上・推定を含む／増悪するショック、またはクラッシュ症候群・それに至る可能性が高い状態）に合致していたか。', add:true },
        { t:'心原性ショックを強く疑う所見がないことを確かめたか。', add:true },
        '実施した処置は適切であったか。',
        ...PROC_COMMON,
        PUNCTURE,

      ]},

// ── 状態（この端末に保存） ──
const LS = 'check_v2';
let store = { state:{}, memo:{}, tab:'cpa' };
try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.state) store = Object.assign(store, s); } catch (e) {}
function save() { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} }
const collapsed = {};
let saveTimer = null;

const txt = it => typeof it === 'string' ? it : it.t;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = (tab, sec, gi, ii) => tab + '-' + sec + '-' + gi + '-' + ii;
const isBad = v => v === 'ng' || v === 'pb';

function eachItem(tab, fn) {
  Object.keys(DATA[tab]).forEach(sec => DATA[tab][sec].groups.forEach((g, gi) =>
    g.items.forEach((it, ii) => fn(sec, g, gi, it, ii, key(tab, sec, gi, ii)))));
}
function count(tab, sec) {
  let total = 0, done = 0;
  eachItem(tab, (s, g, gi, it, ii, k) => { if (sec && s !== sec) return; total++; if (store.state[k]) done++; });
  return { total, done };
}

function tags(it) {
  if (typeof it === 'string') return '';
  return (it.add ? '<span class="tag add">追加</span>' : '')
    + (it.local ? '<span class="tag local">地域MCの決まり（要確認）</span>' : '')
    + (it.q ? '<span class="tag q">言葉の意味は要確認</span>' : '');
}

function itemHtml(tab, g, it, k) {
  const v = store.state[k] || '';
  let h = '<div class="item' + (v ? ' st-' + v : '') + '" id="it-' + k + '">'
    + '<div class="label">' + esc(txt(it)) + tags(it) + '</div><div class="btns">';
  KIND[g.kind].btn.forEach(([val, lab]) => {
    h += '<button class="sbtn' + (v === val ? ' on-' + val : '') + '" onclick="setState(\'' + k + '\',\'' + val + '\')">' + lab + '</button>';
  });
  h += '</div>';
  if (isBad(v)) h += '<textarea class="memo-in" rows="1" placeholder="ひと言メモ（気づいたこと）" oninput="setMemo(\'' + k + '\',this.value)">' + esc(store.memo[k] || '') + '</textarea>';
  return h + '</div>';
}

function renderSec(tab, sec) {
  const S = DATA[tab][sec];
  let h = '<div class="sec-title">' + S.title + '</div>';
  S.groups.forEach((g, gi) => {
    const ck = tab + '-' + sec + '-' + gi;
    const n = g.items.length;
    const d = g.items.filter((_, ii) => store.state[key(tab, sec, gi, ii)]).length;
    h += '<div class="card' + (d === n ? ' all-done' : '') + (collapsed[ck] ? ' collapsed' : '') + '">'
      + '<button class="card-head" onclick="toggleGroup(\'' + tab + '\',\'' + sec + '\',' + gi + ')">'
      + '<span class="card-name">' + g.name + '<span class="card-kind">' + KIND[g.kind].name + '</span></span>'
      + '<span class="card-badge' + (d === n ? ' done' : '') + '">' + d + '/' + n + '</span><span class="chev">▾</span></button>'
      + '<div class="card-body">';
    g.items.forEach((it, ii) => { h += itemHtml(tab, g, it, key(tab, sec, gi, ii)); });
    h += '</div></div>';
  });
  document.getElementById(tab + '-' + sec).innerHTML = h;
}

function summaryHtml(tab, kind) {
  const list = [];
  eachItem(tab, (sec, g, gi, it, ii, k) => {
    if (g.kind === kind && isBad(store.state[k])) list.push({ k, sec, t: txt(it), m: store.memo[k] || '' });
  });
  const cls = kind === 'rec' ? 'ng' : 'pb';
  const label = kind === 'rec' ? '✖ 記載なし' : '⚠ 問題あり';
  let h = '<div class="sum ' + cls + '"><button class="sum-head" onclick="toggleSum(this)">' + label + ' ' + list.length + '件</button><div class="sum-body">';
  h += list.length ? list.map(x => '<div class="sum-item" onclick="goItem(\'' + tab + '\',\'' + x.sec + '\',\'' + x.k + '\')">'
      + esc(x.t) + (x.m ? '<span class="memo">📝 ' + esc(x.m) + '</span>' : '') + '</div>').join('')
    : '<div class="sum-empty">ありません</div>';
  return h + '</div></div>';
}

function renderAside() {
  const tab = store.tab;
  let h = '<div class="side-items">';
  Object.keys(DATA[tab]).forEach(sec => {
    const c = count(tab, sec);
    const pct = c.total ? Math.round(c.done / c.total * 100) : 0;
    h += '<button class="side-item' + (sec === activeSec ? ' active' : '') + '" onclick="goSec(\'' + sec + '\')">'
      + DATA[tab][sec].title + '<span class="side-pct' + (pct === 100 ? ' done' : '') + '">' + pct + '%</span></button>';
  });
  h += '</div><div class="side-extra"><hr class="side-divider">' + summaryHtml(tab, 'rec') + summaryHtml(tab, 'act')
    + '<hr class="side-divider"><button class="reset-btn" onclick="resetTab()">↺ この症例をリセット</button></div>';
  document.getElementById('aside').innerHTML = h;
  // スマホでは一覧とリセットを本文の上に出す
  const mx = document.getElementById('mx-' + tab);
  if (mx) mx.innerHTML = summaryHtml(tab, 'rec') + summaryHtml(tab, 'act')
    + '<button class="reset-btn" style="margin:0 14px 16px" onclick="resetTab()">↺ この症例をリセット</button>';
  const g = count(tab);
  document.getElementById('g-done').textContent = g.done;
  document.getElementById('g-total').textContent = g.total;
}

let activeSec = 's1';
function setState(k, val) {
  const tab = k.split('-')[0], sec = k.split('-')[1];
  if (store.state[k] === val) delete store.state[k]; else store.state[k] = val;
  if (!isBad(store.state[k])) delete store.memo[k];
  save(); renderSec(tab, sec); renderAside();
}
function setMemo(k, v) {
  if (v) store.memo[k] = v; else delete store.memo[k];
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { save(); renderAside(); }, 400);
}
function toggleGroup(tab, sec, gi) {
  const ck = tab + '-' + sec + '-' + gi;
  collapsed[ck] = !collapsed[ck];
  renderSec(tab, sec);
}
function toggleSum(btn) {
  const b = btn.nextElementSibling;
  b.style.display = b.style.display === 'none' ? '' : 'none';
}
function goSec(sec) {
  activeSec = sec;
  document.getElementById(store.tab + '-' + sec).scrollIntoView({ behavior:'smooth', block:'start' });
  renderAside();
}
function goItem(tab, sec, k) {
  activeSec = sec;
  const gi = k.split('-')[2];
  const ck = tab + '-' + sec + '-' + gi;
  if (collapsed[ck]) { collapsed[ck] = false; renderSec(tab, sec); }
  renderAside();
  const el = document.getElementById('it-' + k);
  if (!el) return;
  el.scrollIntoView({ behavior:'smooth', block:'center' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1500);
}
function switchTab(tab) {
  store.tab = tab; activeSec = 's1'; save();
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  renderAside();
  window.scrollTo(0, 0);
}
function resetTab() {
  const tab = store.tab;
  const name = TABS.find(t => t.id === tab).name;
  if (!confirm('「' + name + '」のチェックとメモを消しますか？（ほかのタブは残ります）')) return;
  Object.keys(store.state).forEach(k => { if (k.startsWith(tab + '-')) delete store.state[k]; });
  Object.keys(store.memo).forEach(k => { if (k.startsWith(tab + '-')) delete store.memo[k]; });
  save();
  Object.keys(DATA[tab]).forEach(sec => renderSec(tab, sec));
  renderAside();
}

// ── 画面を組み立てる ──
if (!DATA[store.tab]) store.tab = 'cpa';
document.getElementById('tab-bar').innerHTML = TABS.map(t =>
  '<button class="tab-btn' + (t.id === store.tab ? ' active' : '') + '" data-tab="' + t.id + '" onclick="switchTab(\'' + t.id + '\')">' + t.name + '</button>').join('');
document.getElementById('main').innerHTML = TABS.map(t =>
  '<div class="tab-panel' + (t.id === store.tab ? ' active' : '') + '" id="panel-' + t.id + '">'
  + '<div class="mobile-extra" id="mx-' + t.id + '"></div>'
  + '<p class="note">「追加」は検証で足した項目、「地域MCの決まり（要確認）」は地域の基準で確かめが必要な数値です。チェックとメモはこの端末に残ります。</p>'
  + Object.keys(DATA[t.id]).map(sec => '<div class="section-block" id="' + t.id + '-' + sec + '"></div>').join('')
  + '</div>').join('');
TABS.forEach(t => Object.keys(DATA[t.id]).forEach(sec => renderSec(t.id, sec)));
renderAside();
</script>
