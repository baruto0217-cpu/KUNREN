<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f8fafc; --surface:#ffffff; --surface-2:#f1f5f9; --surface-3:#e2e8f0;
  --dark:#0f172a; --dark-2:#1e293b; --dark-3:#334155; --dark-4:#475569;
  --muted:#94a3b8; --text:#0f172a; --text-2:#334155; --text-3:#64748b;
  --border:#e2e8f0; --border-2:#cbd5e1;
  --blue:#2563eb; --blue-bg:#eff6ff; --blue-bd:#bfdbfe;
  --green:#059669; --green-bg:#ecfdf5; --green-bd:#a7f3d0;
  --red:#dc2626; --red-bg:#fef2f2; --red-bd:#fecaca;
  --amber:#d97706; --amber-bg:#fffbeb; --amber-bd:#fde68a;
  --indigo:#4f46e5; --indigo-bg:#eef2ff; --indigo-bd:#c7d2fe;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px; --r-2xl:32px;
  --shadow:0 1px 3px rgba(0,0,0,.10); --shadow-lg:0 10px 25px rgba(0,0,0,.12);
}
* { -webkit-tap-highlight-color:transparent; }
body {
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.6;
  height:100dvh; overflow:hidden;
}
input,textarea,select,button { font-family:inherit; }
input,textarea,select { font-size:16px !important; }
button { cursor:pointer; }
#app { display:flex; flex-direction:column; height:100dvh; overflow:hidden; }

/* HEADER */
.header { background:var(--dark); color:white; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-shrink:0; border-bottom:1px solid var(--dark-3); z-index:50; }
.header-left { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
.header-logo { background:var(--blue); padding:8px; border-radius:var(--r-md); display:flex; align-items:center; flex-shrink:0; }
#header-title { font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; }
@media(min-width:480px){ #header-title { max-width:260px; font-size:15px; } }
.header-right { display:flex; align-items:center; gap:5px; flex-shrink:0; }
.hbtn { background:none; border:none; padding:8px; border-radius:50%; color:var(--muted); display:flex; align-items:center; transition:background .15s,color .15s; }
.hbtn:hover { background:var(--dark-2); color:white; }
.hbtn:active { transform:scale(.9); }
.hbtn-save { background:var(--blue); border:none; padding:8px; border-radius:50%; color:white; display:flex; align-items:center; }
.hbtn-save:active { transform:scale(.9); }
.hbtn-io { background:var(--dark-3); border:none; padding:8px; border-radius:50%; color:white; display:flex; align-items:center; }
.btn-edit { background:var(--dark-3); border:none; padding:7px 13px; border-radius:99px; color:white; font-size:11px; font-weight:700; display:flex; align-items:center; gap:5px; transition:background .15s; }
.btn-edit:hover { background:var(--dark-4); }
.btn-edit.active { background:#f97316; box-shadow:0 0 0 3px rgba(249,115,22,.25); }

/* SYNC BAR */
.sync-bar { background:var(--dark-2); padding:4px 14px; font-size:10px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:6px; flex-shrink:0; border-bottom:1px solid var(--dark-3); }
.sync-dot { width:6px; height:6px; border-radius:50%; background:var(--muted); flex-shrink:0; }
.sync-dot.ok { background:#22c55e; }

/* PHASE NAV */
.phase-nav { background:var(--surface); border-bottom:1px solid var(--border); padding:10px 12px; display:flex; gap:6px; overflow-x:auto; flex-shrink:0; box-shadow:var(--shadow); }
.phase-nav::-webkit-scrollbar { display:none; }
.phase-btn { background:var(--surface-2); border:none; padding:8px 16px; border-radius:var(--r-md); font-size:11px; font-weight:700; color:var(--text-3); white-space:nowrap; transition:all .15s; flex-shrink:0; }
.phase-btn:hover { background:var(--surface-3); }
.phase-btn.sel-dark { background:var(--dark); color:white; }
.phase-btn.sel-blue { background:var(--blue); color:white; }
.phase-btn-del { background:none; border:none; color:var(--red); font-size:16px; padding:0 4px; display:flex; align-items:center; }
.phase-add-btn { background:none; border:1px dashed var(--blue-bd); color:var(--blue); padding:8px 12px; border-radius:var(--r-md); font-size:18px; display:flex; align-items:center; transition:background .15s; flex-shrink:0; }
.phase-add-btn:hover { background:var(--blue-bg); }
.phase-wrap { display:flex; align-items:center; gap:3px; flex-shrink:0; }

/* MAIN */
main { flex:1; display:flex; overflow:hidden; }
.section { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
.section.hidden { display:none; }
@media(min-width:1024px) { .section.hidden { display:flex; } }
.scroll-area { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; padding:16px; padding-bottom:110px; display:flex; flex-direction:column; gap:14px; }

/* CARDS */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px; }
.card-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:5px; }
.card-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.card-text { font-size:13px; font-weight:500; line-height:1.75; color:var(--text-2); white-space:pre-wrap; }
.card-bold { font-size:13px; font-weight:700; line-height:1.75; color:var(--text); white-space:pre-wrap; }
.card-h { font-size:20px; font-weight:900; color:var(--text); }
.edit-input { width:100%; background:var(--surface-2); border:1px solid var(--border-2); border-radius:var(--r-sm); padding:8px 10px; color:var(--text); outline:none; transition:border-color .15s,box-shadow .15s; }
.edit-input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.15); }
textarea.edit-input { resize:vertical; min-height:80px; line-height:1.6; }

/* INFO CARDS */
.goal-card { background:var(--green-bg); border:1px solid var(--green-bd); border-radius:var(--r-lg); padding:16px; }
.goal-card .card-label { color:var(--green); }
.point-card { background:var(--indigo-bg); border:1px solid var(--indigo-bd); border-radius:var(--r-xl); padding:18px; }
.point-card .card-label { color:var(--indigo); }
.dispatch-card { background:var(--blue-bg); border:1px solid var(--blue-bd); border-radius:var(--r-lg); padding:16px; }
.dispatch-card .card-label { color:var(--blue); }
.callback-card { background:var(--green-bg); border:1px solid var(--green-bd); border-radius:var(--r-lg); padding:16px; }
.callback-card .card-label { color:var(--green); }

/* EMERGENCY */
.emergency-card { background:var(--red); color:white; padding:18px; border-radius:var(--r-lg); box-shadow:0 4px 20px rgba(220,38,38,.3); border-bottom:3px solid #991b1b; }
.emergency-card .e-label { font-size:10px; font-weight:700; opacity:.8; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
.emergency-card .e-value { font-size:22px; font-weight:900; font-style:italic; }

/* ABCDE */
.abcde-panel { background:#0f172a; border:1px solid var(--dark-3); border-radius:var(--r-xl); padding:20px; color:#e2e8f0; }
.abcde-title { color:#60a5fa; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; border-bottom:1px solid var(--dark-3); padding-bottom:10px; margin-bottom:16px; }
.abcde-row { display:flex; gap:14px; margin-bottom:14px; }
.abcde-row:last-child { margin-bottom:0; }
.abcde-letter { font-size:22px; font-weight:900; width:22px; flex-shrink:0; font-family:ui-monospace,monospace; }
.abcde-letter.a { color:#60a5fa; } .abcde-letter.b { color:#34d399; } .abcde-letter.c { color:#f87171; } .abcde-letter.d { color:#fbbf24; } .abcde-letter.e { color:#67e8f9; }
.abcde-text { font-size:14px; font-weight:600; line-height:1.75; font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif; white-space:pre-wrap; color:#e2e8f0; }
textarea.abcde-edit { width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.15); border-radius:var(--r-sm); color:#e2e8f0; padding:10px; font-size:14px; font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif; line-height:1.75; resize:vertical; min-height:70px; outline:none; }
textarea.abcde-edit:focus { border-color:#60a5fa; }

/* HISTORY / SECONDARY */
.hist-card { border:1px solid var(--border); border-left:3px solid var(--amber); border-radius:0 var(--r-lg) var(--r-lg) 0; background:var(--surface); padding:16px 16px 16px 18px; }
.hist-card .card-label { color:var(--amber); }
.sec-card { border:1px solid var(--border); border-left:3px solid var(--indigo); border-radius:0 var(--r-lg) var(--r-lg) 0; background:var(--surface); padding:16px 16px 16px 18px; }
.sec-card .card-label { color:var(--indigo); }

/* VITALS */
.vitals-card { background:var(--surface); border:2px solid var(--green-bd); border-radius:var(--r-xl); padding:18px; position:relative; overflow:hidden; }
.vitals-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--green); }
.vitals-card .card-label { color:var(--green); padding-left:6px; }
.vitals-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
@media(min-width:480px) { .vitals-grid { grid-template-columns:repeat(3,1fr); } }
.vital-item { background:var(--surface-2); padding:10px; border-radius:var(--r-sm); }
.vital-label { font-size:9px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
.vital-val { font-size:18px; font-weight:900; color:var(--text); line-height:1; }
.vital-unit { font-size:9px; color:var(--muted); font-weight:700; margin-left:2px; }

/* FINDINGS */
.findings-card { background:var(--surface-2); border:1px solid var(--border-2); border-radius:var(--r-lg); padding:16px; }
.findings-card .card-label { color:var(--text-3); }

/* EVAL */
.eval-header { background:var(--dark); color:white; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; border-left:1px solid var(--dark-3); }
.eval-header h2 { font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; }
.reset-btn { background:none; border:none; padding:7px; border-radius:var(--r-sm); color:var(--muted); transition:all .15s; display:flex; align-items:center; }
.reset-btn:hover { background:var(--dark-2); color:white; }
.eval-item { padding-bottom:20px; border-bottom:1px solid var(--border); }
.eval-item:last-of-type { border-bottom:none; }
.eval-row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.eval-task { font-size:13px; font-weight:800; line-height:1.55; color:var(--text); flex:1; padding-top:4px; }
.eval-btns { display:flex; gap:5px; background:var(--surface-2); padding:5px; border-radius:var(--r-md); border:1px solid var(--border); flex-shrink:0; }
.eval-btn { background:none; border:none; padding:9px; border-radius:var(--r-sm); color:var(--muted); transition:all .2s; display:flex; align-items:center; }
.eval-btn:active { transform:scale(.88); }
.eval-btn.ok { background:var(--green); color:white; transform:scale(1.08); box-shadow:0 2px 8px rgba(5,150,105,.3); }
.eval-btn.ng { background:var(--red); color:white; transform:scale(1.08); box-shadow:0 2px 8px rgba(220,38,38,.3); }
.eval-feedback { margin-top:12px; background:var(--red-bg); border-left:3px solid var(--red); padding:14px; border-radius:0 var(--r-md) var(--r-md) 0; animation:riseUp .25s ease; }
.eval-feedback-lbl { font-size:10px; font-weight:700; color:var(--red); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
.eval-feedback-txt { font-size:12px; font-weight:700; color:#7f1d1d; line-height:1.7; white-space:pre-wrap; }
.eval-edit-box { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-lg); padding:14px; position:relative; animation:riseUp .25s ease; }
.eval-edit-del { position:absolute; top:10px; right:10px; background:none; border:none; color:var(--muted); transition:color .15s; padding:4px; }
.eval-edit-del:hover { color:var(--red); }

/* TAKE-HOME MESSAGE */
.thm-card { background:linear-gradient(135deg,#4f46e5 0%,#4338ca 100%); color:white; padding:24px; border-radius:var(--r-2xl); box-shadow:0 8px 32px rgba(79,70,229,.3); }
.thm-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; opacity:.7; margin-bottom:12px; }
.thm-text { font-size:14px; font-weight:800; line-height:1.8; font-style:italic; }
.divider { border:none; border-top:3px double var(--border); margin:8px 0; }

/* FOOTER NAV */
.footer-nav { display:flex; justify-content:space-around; background:var(--surface); border-top:1px solid var(--border); padding:8px 16px 12px; flex-shrink:0; box-shadow:0 -4px 20px rgba(0,0,0,.08); z-index:60; }
@media(min-width:1024px) { .footer-nav { display:none; } }
.nav-btn { background:none; border:none; display:flex; flex-direction:column; align-items:center; padding:8px 18px; border-radius:var(--r-lg); gap:3px; color:var(--muted); transition:all .2s; min-width:76px; }
.nav-btn.active { background:var(--blue-bg); color:var(--blue); }
.nav-btn span { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }

/* MODALS */
.overlay { position:fixed; inset:0; background:rgba(15,23,42,.65); backdrop-filter:blur(4px); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; }
.overlay.hidden { display:none; }
.modal { background:var(--surface); width:100%; max-width:540px; border-radius:var(--r-2xl); overflow:hidden; animation:riseUp .3s cubic-bezier(.16,1,.3,1); max-height:80vh; display:flex; flex-direction:column; }
.modal-header { background:var(--dark); color:white; padding:18px 20px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.modal-header h3 { font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
.modal-close { background:none; border:none; color:var(--muted); padding:6px; border-radius:50%; display:flex; align-items:center; transition:all .15s; }
.modal-close:hover { background:var(--dark-2); color:white; }
.modal-body { padding:20px; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1; }
.modal-foot { padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; background:var(--surface); flex-shrink:0; }
.s-item { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); cursor:pointer; transition:all .15s; gap:8px; margin-bottom:10px; }
.s-item:hover { border-color:var(--blue); }
.s-item:active { background:var(--blue-bg); }
.s-item-del { background:none; border:none; color:var(--muted); padding:6px; border-radius:var(--r-sm); transition:color .15s; flex-shrink:0; display:flex; align-items:center; }
.s-item-del:hover { color:var(--red); }
.io-textarea { width:100%; background:#0f172a; color:#4ade80; font-family:ui-monospace,monospace; font-size:12px !important; border:1px solid var(--dark-3); border-radius:var(--r-lg); padding:14px; height:220px; resize:none; outline:none; line-height:1.5; }
.io-copy-btn { position:absolute; top:10px; right:10px; background:rgba(255,255,255,.1); border:none; color:white; padding:6px; border-radius:var(--r-sm); display:flex; align-items:center; transition:background .15s; }
.io-copy-btn:hover { background:rgba(255,255,255,.2); }

/* BUTTONS */
.btn-primary { background:var(--blue); color:white; border:none; padding:11px 22px; border-radius:var(--r-lg); font-weight:700; font-size:13px; display:flex; align-items:center; gap:6px; transition:all .15s; }
.btn-primary:hover { background:#1d4ed8; }
.btn-primary:active { transform:scale(.96); }
.btn-ghost { background:none; color:var(--text-3); border:none; padding:11px 18px; border-radius:var(--r-lg); font-weight:700; font-size:13px; transition:background .15s; }
.btn-ghost:hover { background:var(--surface-2); }

/* TOAST */
.toast { position:fixed; top:70px; left:50%; transform:translateX(-50%); background:var(--dark); color:white; padding:10px 20px; border-radius:99px; font-size:12px; font-weight:700; z-index:200; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
.toast.show { opacity:1; }

.add-eval-row { width:100%; padding:18px; border:2px dashed var(--border-2); border-radius:var(--r-xl); color:var(--text-3); background:none; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; gap:8px; transition:all .15s; margin-top:8px; }
.add-eval-row:hover { background:var(--blue-bg); border-color:var(--blue-bd); color:var(--blue); }
.error-msg { background:var(--red-bg); color:var(--red); font-size:12px; font-weight:700; padding:10px 14px; border-radius:var(--r-sm); border-left:3px solid var(--red); }
.select-edit { background:var(--dark-2); border:1px solid var(--dark-3); border-radius:var(--r-sm); color:white; padding:8px 12px; width:100%; outline:none; }

@keyframes riseUp { from { opacity:0; transform:translateY(16px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
.animate { animation:riseUp .28s cubic-bezier(.16,1,.3,1); }
</style>
</head>
<body>
<div id="app">
  <header class="header">
    <div class="header-left">
      <div class="header-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      </div>
      <div id="header-title">読み込み中...</div>
    </div>
    <div class="header-right">
      <button class="hbtn" id="btn-library" title="症例ライブラリ">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </button>
      <span id="edit-btns" style="display:none;align-items:center;gap:5px">
        <button class="hbtn-io" id="btn-io" title="データ入出力">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button class="hbtn-save" id="btn-save" title="保存">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        </button>
      </span>
      <button class="btn-edit" id="btn-edit">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 1.41 14.14M4.93 4.93a10 10 0 0 0-1.41 14.14"/></svg>
        <span id="edit-label">想定編集</span>
      </button>
    </div>
  </header>

  <div class="sync-bar">
    <div class="sync-dot ok" id="sync-dot"></div>
    <span id="sync-label">ローカル保存のみ</span>
  </div>

  <div class="phase-nav" id="phase-nav"></div>

  <main>
    <section class="section" id="sec-monitor">
      <div class="scroll-area" id="monitor-area"></div>
    </section>
    <section class="section hidden" id="sec-eval">
      <div class="eval-header">
        <h2>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          活動評価表
        </h2>
        <button class="reset-btn" id="btn-reset" title="評価リセット">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
        </button>
      </div>
      <div class="scroll-area" id="eval-area"></div>
    </section>
  </main>

  <nav class="footer-nav">
    <button class="nav-btn active" id="nav-mon" onclick="switchTab('monitor')">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>Monitor</span>
    </button>
    <button class="nav-btn" id="nav-eval" onclick="switchTab('eval')">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Evaluate</span>
    </button>
  </nav>

  <!-- Library Modal -->
  <div class="overlay hidden" id="modal-lib">
    <div class="modal">
      <div class="modal-header">
        <h3><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> 症例ライブラリ</h3>
        <button class="modal-close" onclick="closeModal('modal-lib')"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body" id="lib-body"></div>
    </div>
  </div>

  <!-- IO Modal -->
  <div class="overlay hidden" id="modal-io">
    <div class="modal">
      <div class="modal-header">
        <h3><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> データ入出力</h3>
        <button class="modal-close" onclick="closeModal('modal-io')"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <p style="font-size:12px;font-weight:700;color:var(--text-3);margin-bottom:14px;line-height:1.7">【エクスポート】コピーボタンでテキストをコピーし、メモ帳などに保存。<br>【インポート】保存したテキストを貼り付けて「読み込む」を押す。</p>
        <div style="position:relative">
          <textarea class="io-textarea" id="io-text" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
          <button class="io-copy-btn" id="btn-copy">
            <svg id="copy-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
        <div id="io-error" style="margin-top:10px"></div>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" onclick="closeModal('modal-io')">キャンセル</button>
        <button class="btn-primary" id="btn-import">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          読み込む
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
'use strict';
const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2,9)}`;

const DEFAULT_PHASE = () => ({
  id:uid(), label:'接触時', physiologicalEval:'緊急度：高',
  abcde:{
    a:'気道開通。発語あり。',
    b:'呼吸数18回/分。努力呼吸なし。肺音清。',
    c:'橈骨脈触知可能。皮膚冷感・湿潤。CRT 2秒。',
    d:'JCS 1。瞳孔等大。対光反射迅速。',
    e:'体温36.5度。特記すべき外傷なし。'
  },
  history:'【SAMPLE】\nS (症状): \nA (アレルギー): \nM (持病・薬): \nP (既往歴): \nL (最終食事): \nE (状況): \n\n【GUMBA】\nG (既往歴): \nU (訴え): \nM (薬): \nB (病院): \nA (アレルギー): ',
  secondary:'全身観察所見を入力...',
  vitals:{jcs:'0',hr:'80',bp:'120/70',rr:'16',temp:'36.5',spo2:'98',ecg:'Sinus'},
  findings:'現場の状況や補足事項...'
});

const DEFAULT_SCENARIO = () => ({
  id:uid(), title:'新規救急シナリオ',
  info:{
    age:'60代', gender:'男性',
    goals:'・正確な生理学的評価の実施\n・病態に応じた搬送先選定',
    points:'環境要因と主訴の不一致から隠れた内科的疾患を疑う。',
    dispatch:'意識障害疑いでの出場。自室内で倒れているところを家族が発見。',
    callback:'呼びかけに反応はあるが、会話が噛み合わない様子。',
    hpi:'1時間前まで普段通り過ごしていたが、その後連絡がつかなくなった。',
    situation:'室内。暖房なし。床上に仰臥位。',
    takeHomeMessage:'現場での「観察の違和感」を大切にし、多角的な評価を継続してください。'
  },
  phases:[DEFAULT_PHASE()],
  evaluations:[
    {id:uid(),task:'適切なABCDEアプローチ',explanation:'手順通りに生理学的評価が実施されたか。'},
    {id:uid(),task:'バイタルサインの正確な評価',explanation:'JCS・HR・BP・RR・SpO2・体温を漏れなく評価したか。'}
  ]
});

let scenario    = DEFAULT_SCENARIO();
let savedList   = [];
let phaseIdx    = -1;
let evalResults = {};
let editMode    = false;
let activeTab   = 'monitor';

const LS_DRAFT   = 'pemec_draft';
const LS_LIBRARY = 'pemec_library';

function saveDraftLocal() {
  try {
    localStorage.setItem(LS_DRAFT,   JSON.stringify({scenario,phaseIdx,evalResults}));
    localStorage.setItem(LS_LIBRARY, JSON.stringify(savedList));
  } catch(e){}
}
function loadDraftLocal() {
  try {
    const d = localStorage.getItem(LS_DRAFT);
    if(d){ const o=JSON.parse(d); if(o.scenario)scenario=o.scenario; if(o.phaseIdx!==undefined)phaseIdx=o.phaseIdx; if(o.evalResults)evalResults=o.evalResults; }
    const lib = localStorage.getItem(LS_LIBRARY);
    if(lib) savedList=JSON.parse(lib);
  } catch(e){}
}

let _st=null;
function scheduleSave(){ clearTimeout(_st); _st=setTimeout(saveDraftLocal,1200); }

async function saveScenario(){
  const idx=savedList.findIndex(s=>s.id===scenario.id);
  if(idx>=0) savedList[idx]={...scenario};
  else savedList.unshift({...scenario});
  saveDraftLocal(); renderLibraryList();
  showToast('保存しました'); setEditMode(false);
}
async function deleteScenario(id,e){ e.stopPropagation(); savedList=savedList.filter(x=>x.id!==id); saveDraftLocal(); renderLibraryList(); }
function loadScenario(id){ const s=savedList.find(x=>x.id===id); if(!s)return; scenario=JSON.parse(JSON.stringify(s)); phaseIdx=-1; evalResults={}; closeModal('modal-lib'); renderAll(); }

function setEditMode(val){
  editMode=val;
  document.getElementById('btn-edit').classList.toggle('active',val);
  document.getElementById('edit-label').textContent=val?'完了':'想定編集';
  document.getElementById('edit-btns').style.display=val?'flex':'none';
  renderAll();
  if(window.innerWidth<1024) switchTab(activeTab);
}
function addPhase(){ const last=JSON.parse(JSON.stringify(scenario.phases.slice(-1)[0]||DEFAULT_PHASE())); last.id=uid(); last.label=`経過${scenario.phases.length}`; scenario.phases.push(last); phaseIdx=scenario.phases.length-1; scheduleSave(); renderAll(); }
function deletePhase(i){ if(scenario.phases.length<=1)return; scenario.phases.splice(i,1); phaseIdx=-1; scheduleSave(); renderAll(); }
function setEval(id,val){ evalResults[id]=evalResults[id]===val?undefined:val; scheduleSave(); renderEval(); }
function resetEval(){ evalResults={}; scheduleSave(); renderEval(); }
function addEvalItem(){ scenario.evaluations.push({id:uid(),task:'新規評価項目',explanation:'根拠やポイントを記載...'}); scheduleSave(); renderEval(); }
function deleteEvalItem(id){ scenario.evaluations=scenario.evaluations.filter(e=>e.id!==id); scheduleSave(); renderEval(); }
function switchTab(tab){ activeTab=tab; document.getElementById('sec-monitor').classList.toggle('hidden',tab!=='monitor'); document.getElementById('sec-eval').classList.toggle('hidden',tab!=='eval'); document.getElementById('nav-mon').classList.toggle('active',tab==='monitor'); document.getElementById('nav-eval').classList.toggle('active',tab==='eval'); }
function openModal(id){ document.getElementById(id).classList.remove('hidden'); }
function closeModal(id){ document.getElementById(id).classList.add('hidden'); }
function openIO(){ document.getElementById('io-text').value=JSON.stringify(scenario,null,2); document.getElementById('io-error').innerHTML=''; openModal('modal-io'); }
async function copyIO(){
  const txt=document.getElementById('io-text').value;
  try{
    if(navigator.clipboard&&window.isSecureContext) await navigator.clipboard.writeText(txt);
    else{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='position:fixed;left:-9999px;top:-9999px'; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
    const icon=document.getElementById('copy-icon');
    icon.innerHTML='<polyline points="20 6 9 17 4 12"></polyline>';
    setTimeout(()=>{ icon.innerHTML='<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'; },2000);
  }catch(e){}
}
function importIO(){
  const errEl=document.getElementById('io-error'); errEl.innerHTML='';
  try{
    const parsed=JSON.parse(document.getElementById('io-text').value);
    if(!parsed||!parsed.title||!Array.isArray(parsed.phases)){ errEl.innerHTML='<div class="error-msg">正しいシナリオデータではありません。</div>'; return; }
    scenario=parsed; phaseIdx=-1; evalResults={}; closeModal('modal-io'); scheduleSave(); renderAll(); showToast('読み込みました');
  }catch(e){ errEl.innerHTML='<div class="error-msg">JSONの形式が不正です。</div>'; }
}
let _tt=null;
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2500); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderAll(){ document.getElementById('header-title').textContent=scenario.title; renderPhaseNav(); renderMonitor(); renderEval(); if(window.innerWidth<1024) switchTab(activeTab); }

function renderPhaseNav(){
  const nav=document.getElementById('phase-nav');
  let h=`<button class="phase-btn ${phaseIdx===-1?'sel-dark':''}" onclick="phaseIdx=-1;renderAll()">事前情報</button>`;
  h+=`<button class="phase-btn ${phaseIdx===-2?'sel-dark':''}" onclick="phaseIdx=-2;renderAll()">通報内容</button>`;
  scenario.phases.forEach((p,i)=>{
    h+=`<div class="phase-wrap">`;
    if(editMode){
      h+=`<div style="display:flex;flex-direction:column;gap:3px;align-items:center">`;
      h+=`<button class="phase-btn ${phaseIdx===i?'sel-blue':''}" onclick="phaseIdx=${i};renderAll()" id="phase-tab-btn-${i}">${esc(p.label)}</button>`;
      h+=`<input style="width:80px;font-size:10px;padding:3px 6px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface);color:var(--text);text-align:center;outline:none" value="${esc(p.label)}" oninput="scenario.phases[${i}].label=this.value;scheduleSave();const b=document.getElementById('phase-tab-btn-${i}');if(b)b.textContent=this.value;">`;
      h+=`</div>`;
      if(scenario.phases.length>1) h+=`<button class="phase-btn-del" onclick="deletePhase(${i})">✕</button>`;
    } else {
      h+=`<button class="phase-btn ${phaseIdx===i?'sel-blue':''}" onclick="phaseIdx=${i};renderAll()">${esc(p.label)}</button>`;
    }
    h+=`</div>`;
  });
  if(editMode) h+=`<button class="phase-add-btn" onclick="addPhase()">＋</button>`;
  nav.innerHTML=h;
}

function renderMonitor(){ document.getElementById('monitor-area').innerHTML=phaseIdx===-1?renderInfo():phaseIdx===-2?renderDispatch():renderPhase(scenario.phases[phaseIdx],phaseIdx); }

function renderInfo(){
  const info=scenario.info, e=editMode;
  const ta=(fld,val,h=80)=>`<textarea class="edit-input" style="min-height:${h}px" oninput="scenario.info.${fld}=this.value;scheduleSave()">${esc(val)}</textarea>`;
  const inp=(fld,val,ph='')=>`<input class="edit-input" value="${esc(val)}" placeholder="${ph}" oninput="scenario.info.${fld}=this.value;scheduleSave()">`;
  let h=`<div class="animate">`;
  if(e) h+=`<div class="card" style="border-color:var(--blue-bd)"><div class="card-label">シナリオタイトル</div><input class="edit-input" value="${esc(scenario.title)}" oninput="scenario.title=this.value;document.getElementById('header-title').textContent=this.value;scheduleSave()"></div>`;
  h+=`<div class="card-grid-2">
    <div class="card"><div class="card-label">対象者</div>${e?`<div style="display:flex;gap:8px">${inp('age',info.age||'','年齢')}${inp('gender',info.gender||'','性別')}</div>`:`<div class="card-h">${esc(info.age||'-')} / ${esc(info.gender||'-')}</div>`}</div>
    <div class="goal-card"><div class="card-label">到達目標</div>${e?ta('goals',info.goals||'',90):`<div class="card-bold">${esc(info.goals||'-')}</div>`}</div>
  </div>
  <div class="point-card"><div class="card-label">シナリオのポイント</div>${e?ta('points',info.points||'',90):`<div class="card-bold" style="font-size:14px">${esc(info.points||'-')}</div>`}</div>
  <div class="card-grid-2">
    <div class="dispatch-card"><div class="card-label">指令内容</div>${e?ta('dispatch',info.dispatch||'',80):`<div class="card-bold">${esc(info.dispatch||'-')}</div>`}</div>
    <div class="callback-card"><div class="card-label">コールバック</div>${e?ta('callback',info.callback||'',80):`<div class="card-bold">${esc(info.callback||'-')}</div>`}</div>
  </div>
  <div class="card-grid-2">
    <div class="card"><div class="card-label">現病歴</div>${e?ta('hpi',info.hpi||'',90):`<div class="card-text">${esc(info.hpi||'-')}</div>`}</div>
    <div class="card"><div class="card-label">現場状況</div>${e?ta('situation',info.situation||'',90):`<div class="card-text">${esc(info.situation||'-')}</div>`}</div>
  </div></div>`;
  return h;
}

function renderDispatch(){
  const e=editMode;
  if(!scenario.info.dispatchLines) scenario.info.dispatchLines=[];
  const lines=scenario.info.dispatchLines;

  // テキストカラーの定義
  const textColorMap={red:'#dc2626',blue:'#2563eb',black:'var(--text)'};
  const textColorLabel={red:'赤',blue:'青',black:'黒'};

  let h=`<div class="animate">`;

  if(lines.length===0 && !e){
    h+=`<div style="text-align:center;padding:48px 0;color:var(--muted);font-weight:700">通報内容がありません</div>`;
  } else {
    lines.forEach((line,i)=>{
      const isDispatcher=line.role==='dispatcher';
      const bgColor=isDispatcher?'var(--blue-bg)':'var(--surface)';
      const bdColor=isDispatcher?'var(--blue-bd)':'var(--border)';
      const labelColor=isDispatcher?'var(--blue)':'var(--amber)';
      const roleLabel=isDispatcher?'指令員':'通報者';
      const align=isDispatcher?'flex-start':'flex-end';
      const bubbleRadius=isDispatcher?'4px var(--r-lg) var(--r-lg) var(--r-lg)':'var(--r-lg) 4px var(--r-lg) var(--r-lg)';
      const textColor=textColorMap[line.color||'black']||textColorMap.black;

      if(e){
        // カラーボタン3つ
        const colorBtns=['red','blue','black'].map(c=>{
          const active=(line.color||'black')===c;
          const dotColor=textColorMap[c];
          return `<button title="${textColorLabel[c]}" onclick="scenario.info.dispatchLines[${i}].color='${c}';scheduleSave();renderMonitor()" style="width:26px;height:26px;border-radius:50%;border:2px solid ${active?dotColor:'var(--border-2)'};background:${active?dotColor+'22':'transparent'};cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s">
            <span style="width:12px;height:12px;border-radius:50%;background:${dotColor};display:block"></span>
          </button>`;
        }).join('');

        h+=`<div style="background:${bgColor};border:1px solid ${bdColor};border-radius:var(--r-lg);padding:14px;" data-line-idx="${i}">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
            <div style="font-size:10px;font-weight:700;color:${labelColor};text-transform:uppercase;letter-spacing:.06em;flex:1;min-width:60px">${roleLabel}</div>
            <div style="display:flex;align-items:center;gap:4px">${colorBtns}</div>
            <select style="background:var(--dark-2);border:1px solid var(--dark-3);border-radius:var(--r-sm);color:white;padding:4px 8px;font-size:11px;outline:none" onchange="scenario.info.dispatchLines[${i}].role=this.value;scheduleSave();renderMonitor()">
              <option value="dispatcher" ${line.role==='dispatcher'?'selected':''}>指令員</option>
              <option value="caller" ${line.role==='caller'?'selected':''}>通報者</option>
            </select>
            <button style="background:none;border:none;color:var(--muted);padding:4px;cursor:pointer;display:flex;align-items:center" onclick="scenario.info.dispatchLines.splice(${i},1);scheduleSave();renderMonitor()" title="削除">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </div>
          <textarea class="edit-input" style="min-height:60px;color:${textColor};font-weight:700" oninput="scenario.info.dispatchLines[${i}].text=this.value;scheduleSave()">${esc(line.text||'')}</textarea>
        </div>`;
      } else {
        h+=`<div style="display:flex;flex-direction:column;align-items:${align}">
          <div style="font-size:10px;font-weight:700;color:${labelColor};margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em">${roleLabel}</div>
          <div style="background:${bgColor};border:1px solid ${bdColor};border-radius:${bubbleRadius};padding:12px 16px;max-width:85%">
            <div style="font-size:13px;font-weight:700;line-height:1.7;color:${textColor};white-space:pre-wrap">${esc(line.text||'')}</div>
          </div>
        </div>`;
      }
    });
  }

  if(e){
    h+=`<div style="display:flex;gap:8px;margin-top:4px">
      <button class="add-eval-row" style="flex:1;margin-top:0" onclick="scenario.info.dispatchLines.push({role:'dispatcher',text:'',color:'black'});scheduleSave();renderMonitor()">＋ 指令員</button>
      <button class="add-eval-row" style="flex:1;margin-top:0;border-color:var(--amber-bd);color:var(--amber)" onclick="scenario.info.dispatchLines.push({role:'caller',text:'',color:'black'});scheduleSave();renderMonitor()">＋ 通報者</button>
    </div>`;
  }

  h+=`</div>`;
  return h;
}

function renderPhase(p,pi){
  const e=editMode;
  const phta=(fld,val,h=70)=>`<textarea class="edit-input" style="min-height:${h}px" oninput="scenario.phases[${pi}].${fld}=this.value;scheduleSave()">${esc(val)}</textarea>`;
  const abcKeys=[{k:'a',cls:'a'},{k:'b',cls:'b'},{k:'c',cls:'c'},{k:'d',cls:'d'},{k:'e',cls:'e'}];
  const vKeys=[{k:'jcs',l:'JCS',u:''},{k:'hr',l:'脈拍',u:'bpm'},{k:'bp',l:'血圧',u:'mmHg'},{k:'rr',l:'呼吸数',u:'回'},{k:'temp',l:'体温',u:'℃'},{k:'spo2',l:'SpO2',u:'%'},{k:'ecg',l:'心電図',u:''}];
  let h=`<div class="animate">`;
  h+=`<div class="emergency-card"><div class="e-label">生理学的評価</div>${e?`<select class="select-edit" onchange="scenario.phases[${pi}].physiologicalEval=this.value;scheduleSave()">${['緊急度：極めて高い','緊急度：高','緊急度：中','緊急度：低','生理学的評価：安定'].map(v=>`<option value="${v}" ${p.physiologicalEval===v?'selected':''}>${v}</option>`).join('')}</select>`:`<div class="e-value">${esc(p.physiologicalEval)}</div>`}</div>`;
  h+=`<div class="abcde-panel"><div class="abcde-title">Phase Assessment (ABCDE)</div>`;
  abcKeys.forEach(item=>{
    h+=`<div class="abcde-row"><span class="abcde-letter ${item.cls}">${item.k.toUpperCase()}</span><div style="flex:1;min-width:0">${e?`<textarea class="abcde-edit" oninput="scenario.phases[${pi}].abcde.${item.k}=this.value;scheduleSave()">${esc(p.abcde?.[item.k]||'')}</textarea>`:`<div class="abcde-text">${esc(p.abcde?.[item.k]||'-')}</div>`}</div></div>`;
  });
  h+=`</div>`;
  h+=`<div class="hist-card"><div class="card-label">主訴・病歴 (SAMPLE / GUMBA)</div>${e?phta('history',p.history||'',160):`<div class="card-text">${esc(p.history||'-')}</div>`}</div>`;
  h+=`<div class="sec-card"><div class="card-label">全身観察所見</div>${e?phta('secondary',p.secondary||'',120):`<div class="card-bold">${esc(p.secondary||'-')}</div>`}</div>`;
  h+=`<div class="vitals-card"><div class="card-label">バイタルサイン</div><div class="vitals-grid">`;
  vKeys.forEach(v=>{ const val=p.vitals?.[v.k]||''; h+=`<div class="vital-item"><div class="vital-label">${v.l}</div>${e?`<input class="edit-input" style="padding:5px 8px" value="${esc(val)}" oninput="scenario.phases[${pi}].vitals.${v.k}=this.value;scheduleSave()">`:`<span class="vital-val">${esc(val||'-')}</span><span class="vital-unit">${v.u}</span>`}</div>`; });
  h+=`</div></div>`;
  h+=`<div class="findings-card"><div class="card-label">環境・補足事項</div>${e?phta('findings',p.findings||'',70):`<div class="card-text" style="font-style:italic">${esc(p.findings||'-')}</div>`}</div>`;
  h+=`</div>`;
  return h;
}

function renderEval(){
  const el=document.getElementById('eval-area'), e=editMode;
  const sorted=e?[...scenario.evaluations]:[...scenario.evaluations].sort((a,b)=>(evalResults[b.id]==='ng'?1:0)-(evalResults[a.id]==='ng'?1:0));
  let h='';
  sorted.forEach(item=>{
    const oi=scenario.evaluations.findIndex(x=>x.id===item.id), res=evalResults[item.id];
    if(e){
      h+=`<div class="eval-item eval-edit-box" data-eid="${esc(item.id)}" draggable="true" style="cursor:default">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <span class="drag-handle" style="cursor:grab;color:var(--muted);display:flex;align-items:center;padding:2px 4px;border-radius:4px;user-select:none">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </span>
          <div class="card-label" style="margin-bottom:0;flex:1">項目 ${oi+1}</div>
          <button class="eval-edit-del" data-del-eval="${esc(item.id)}" style="position:static"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg></button>
        </div>
        <input class="edit-input" style="margin-bottom:8px;font-weight:700" value="${esc(item.task)}" oninput="scenario.evaluations[${oi}].task=this.value;scheduleSave()">
        <textarea class="edit-input" style="min-height:80px" oninput="scenario.evaluations[${oi}].explanation=this.value;scheduleSave()">${esc(item.explanation)}</textarea>
      </div>`;
    } else {
      h+=`<div class="eval-item">
        <div class="eval-row">
          <div class="eval-task">${esc(item.task)}</div>
          <div class="eval-btns">
            <button class="eval-btn ${res==='ok'?'ok':''}" data-eval-id="${esc(item.id)}" data-eval-val="ok"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></button>
            <button class="eval-btn ${res==='ng'?'ng':''}" data-eval-id="${esc(item.id)}" data-eval-val="ng"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></button>
          </div>
        </div>
        ${res==='ng'?`<div class="eval-feedback"><div class="eval-feedback-lbl">指導根拠・フィードバック</div><div class="eval-feedback-txt">${esc(item.explanation)}</div></div>`:''}
      </div>`;
    }
  });
  h+=`<hr class="divider">`;
  if(e){
    h+=`<div><div class="card-label" style="color:var(--indigo)">Take-home Message</div><textarea class="edit-input" style="min-height:90px;font-weight:700" oninput="scenario.info.takeHomeMessage=this.value;scheduleSave()">${esc(scenario.info.takeHomeMessage||'')}</textarea></div>`;
    h+=`<button class="add-eval-row" data-add-eval="1">＋ 評価項目を追加</button>`;
  } else {
    h+=`<div class="thm-card"><div class="thm-label">Take-home Message</div><div class="thm-text">"${esc(scenario.info.takeHomeMessage||'本日の実習のまとめをここに設定できます。')}"</div></div>`;
  }
  el.innerHTML=h;

  el.onclick=(ev)=>{
    const delBtn=ev.target.closest('[data-del-eval]');
    if(delBtn){ deleteEvalItem(delBtn.getAttribute('data-del-eval')); return; }
    if(ev.target.closest('[data-add-eval]')){ addEvalItem(); return; }
    const evalBtn=ev.target.closest('[data-eval-id]');
    if(evalBtn){
      const id=evalBtn.getAttribute('data-eval-id');
      const val=evalBtn.getAttribute('data-eval-val');
      evalResults[id]=evalResults[id]===val?undefined:val;
      scheduleSave(); renderEval();
    }
  };

  if(e) initEvalDragSort(el);
}

let _dragSrc=null;
function initEvalDragSort(container){
  container.querySelectorAll('.eval-edit-box').forEach(item=>{
    item.addEventListener('dragstart',(ev)=>{
      _dragSrc=item; ev.dataTransfer.effectAllowed='move';
      setTimeout(()=>item.style.opacity='0.4',0);
    });
    item.addEventListener('dragend',()=>{
      item.style.opacity='';
      container.querySelectorAll('.eval-edit-box').forEach(i=>i.style.borderTopColor='');
    });
    item.addEventListener('dragover',(ev)=>{
      ev.preventDefault(); ev.dataTransfer.dropEffect='move';
      if(item!==_dragSrc) item.style.borderTopColor='var(--blue)';
    });
    item.addEventListener('dragleave',()=>{ item.style.borderTopColor=''; });
    item.addEventListener('drop',(ev)=>{
      ev.preventDefault();
      if(!_dragSrc||_dragSrc===item) return;
      const srcId=_dragSrc.getAttribute('data-eid');
      const dstId=item.getAttribute('data-eid');
      const si=scenario.evaluations.findIndex(x=>x.id===srcId);
      const di=scenario.evaluations.findIndex(x=>x.id===dstId);
      if(si<0||di<0) return;
      const moved=scenario.evaluations.splice(si,1)[0];
      scenario.evaluations.splice(di,0,moved);
      scheduleSave(); renderEval();
    });
  });
}

function renderLibraryList(){
  const body=document.getElementById('lib-body');
  if(!savedList.length){
    body.innerHTML=`<div style="text-align:center;padding:48px 0;color:var(--muted);font-weight:700">保存されたデータがありません</div>`;
    return;
  }
  body.innerHTML=savedList.map(s=>`
    <div class="s-item" data-sid="${esc(s.id)}">
      <div style="min-width:0;flex:1">
        <div style="font-weight:700;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.title)}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">${esc(s.info?.age||'')} ${esc(s.info?.gender||'')} &bull; ${(s.phases||[]).length} フェーズ</div>
      </div>
      <button class="s-item-del" data-del="${esc(s.id)}">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg>
      </button>
    </div>`).join('');

  body.onclick = (e) => {
    const delBtn = e.target.closest('[data-del]');
    if(delBtn){
      e.stopPropagation();
      const id = delBtn.getAttribute('data-del');
      savedList = savedList.filter(x => x.id !== id);
      saveDraftLocal();
      renderLibraryList();
      return;
    }
    const item = e.target.closest('[data-sid]');
    if(item){
      const id = item.getAttribute('data-sid');
      const s = savedList.find(x => x.id === id);
      if(!s) return;
      scenario    = JSON.parse(JSON.stringify(s));
      phaseIdx    = -1;
      evalResults = {};
      closeModal('modal-lib');
      renderAll();
    }
  };
}

function handleResize(){
  if(window.innerWidth>=1024){
    document.getElementById('sec-monitor').classList.remove('hidden');
    document.getElementById('sec-eval').classList.remove('hidden');
    document.getElementById('nav-mon').classList.remove('active');
    document.getElementById('nav-eval').classList.remove('active');
  } else {
    switchTab(activeTab);
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  loadDraftLocal(); renderAll(); renderLibraryList(); handleResize();
  if('serviceWorker' in navigator){
    const swCode = `
const CACHE='ems-sim-v1';
self.addEventListener('install',e=>{
  e.waitUntil(
    caches.open(CACHE).then(c=>c.addAll([location.href])).catch(()=>{})
  );
  self.skipWaiting();
});
self.addEventListener('activate',e=>{
  e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener('fetch',e=>{
  e.respondWith(
    fetch(e.request).then(r=>{
      const clone=r.clone();
      caches.open(CACHE).then(c=>c.put(e.request,clone));
      return r;
    }).catch(()=>caches.match(e.request))
  );
});`;
    const swBlob = new Blob([swCode],{type:'application/javascript'});
    const swUrl  = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl,{scope:'./'}).catch(()=>{});
  }
  document.getElementById('btn-edit').addEventListener('click',()=>setEditMode(!editMode));
  document.getElementById('btn-save').addEventListener('click',saveScenario);
  document.getElementById('btn-library').addEventListener('click',()=>{ renderLibraryList(); openModal('modal-lib'); });
  document.getElementById('btn-io').addEventListener('click',openIO);
  document.getElementById('btn-import').addEventListener('click',importIO);
  document.getElementById('btn-copy').addEventListener('click',copyIO);
  document.getElementById('btn-reset').addEventListener('click',resetEval);
  document.querySelectorAll('.overlay').forEach(el=>{ el.addEventListener('click',e=>{ if(e.target===el)closeModal(el.id); }); });
  window.addEventListener('resize',handleResize);
});
</script>
